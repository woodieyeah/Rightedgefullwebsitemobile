name: iOS simulator smoke

# Builds the Capacitor shell and PROVES it renders, on a GitHub-hosted macOS
# runner that already has Xcode and the iOS simulators installed.
#
# WHY THIS EXISTS
# The local Mac has no Xcode and cannot install it (no usable Apple ID). These
# runners need no Apple ID at all, and this repository is public so macOS
# minutes are free. A simulator build requires no signing certificate and no
# Apple Developer Program membership.
#
# WHAT IT PROVES
# Not "BUILD SUCCEEDED" -- that passes even when the webview paints nothing.
# It boots a simulator, launches the app, screenshots it, and uploads the
# screenshot plus logs as artifacts so the render can be inspected by eye.
#
# Triggered on push to the feature branch (workflow_dispatch alone would
# require this file to live on the default branch first).

on:
  push:
    branches: [feature/capacitor-api-compat]
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select an Xcode that has matching simulator runtimes
        run: |
          # The image ships several Xcodes. Prefer a recent one that has its
          # iOS runtime preinstalled, so we never pay the ~10-15 min
          # xcodebuild -downloadPlatform cost.
          for v in Xcode_26.2 Xcode_26.1.1 Xcode_26.0.1 Xcode_16.4; do
            if [ -d "/Applications/$v.app" ]; then
              sudo xcode-select -s "/Applications/$v.app"
              break
            fi
          done
          xcodebuild -version
          echo "--- available iPhone simulators ---"
          xcrun simctl list devices available | grep -E "iPhone" | head -20

      - name: Install dependencies
        run: |
          # node_modules is committed with LINUX binaries (Vercel builds on
          # linux). The runner is darwin-arm64, so it needs its own platform
          # binaries. This is ephemeral: nothing here is ever committed back.
          npm install --no-audit --no-fund

      - name: Build the web bundle
        run: npm run build

      - name: Inject diagnostics into the built page
        run: |
          # Three probes, all removed by the next `cap sync` because that
          # regenerates ios/App/App/public from dist/.
          #
          # 1. A visible error reporter. A JS error in a simulator WKWebView
          #    blanks the screen and does NOT appear in the native log, so
          #    painting it into the DOM is the only way to read it off a
          #    screenshot.
          # 2. A redacting fetch recorder. "Did it reach the real API?" cannot
          #    be answered from a screenshot: bundled fallback content looks
          #    identical to live data. URLs are redacted BEFORE they are stored
          #    so no token, email, sheet id or checkout id can reach an
          #    artifact.
          # 3. A scripted navigator. AppleScript taps do not work on a GitHub
          #    runner (no accessibility permission for System Events), so
          #    navigation is driven through the app's own hash routing on a
          #    timer. This exercises the real checkHash() path.
          cat > /tmp/probe.html <<'PROBE'
          <script>
          (function(){
            // ---- redaction -------------------------------------------------
            // Anything that reaches __netlog is already sanitised: query values
            // are dropped unless explicitly safe, and long path segments (sheet
            // ids, cs_ checkout ids, uuids) are masked.
            var SAFE_QUERY = ['competition','round','gid','single','output'];
            function redact(raw){
              try {
                var u = new URL(String(raw), 'https://native.local');
                var path = u.pathname
                  .replace(/\/(cs_|sub_|cus_|pi_)[A-Za-z0-9_]+/g, '/$1<redacted>')
                  .replace(/\/[A-Za-z0-9_-]{24,}/g, '/<id>');
                var qs = [];
                u.searchParams.forEach(function(v,k){
                  qs.push(k + '=' + (SAFE_QUERY.indexOf(k) >= 0 ? v : '<redacted>'));
                });
                var host = u.host === 'native.local' ? '' : u.host;
                return host + path + (qs.length ? '?' + qs.join('&') : '');
              } catch (e) { return '<unparseable-url>'; }
            }
            function scrub(s){
              return String(s == null ? '' : s)
                .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '<email>')
                .replace(/\b(cs_|sk_|pk_|sub_|cus_|pi_)[A-Za-z0-9_]+/g, '$1<redacted>')
                .replace(/\beyJ[A-Za-z0-9_.-]{20,}/g, '<jwt>')
                .slice(0, 180);
            }

            // ---- network recorder -----------------------------------------
            window.__netlog = [];
            var origFetch = window.fetch;
            window.fetch = function(input){
              var raw = (typeof input === 'string') ? input : (input && input.url) || String(input);
              var url = redact(raw);
              var started = Date.now();
              return origFetch.apply(this, arguments).then(function(res){
                window.__netlog.push({url: url, status: res.status, ok: res.ok, ms: Date.now()-started});
                return res;
              }).catch(function(err){
                window.__netlog.push({url: url, status: 'NETWORK_FAIL', ok: false, error: scrub(err && err.message), ms: Date.now()-started});
                throw err;
              });
            };

            // ---- visible error reporter -----------------------------------
            function paint(msg){
              var d=document.createElement('pre');
              d.id='hermes-error';
              d.style.cssText='position:fixed;inset:0;z-index:2147483647;margin:0;padding:16px;'+
                'background:#300;color:#fff;font:12px ui-monospace,monospace;white-space:pre-wrap;overflow:auto';
              d.textContent='JS ERROR\n\n'+scrub(msg);
              (document.body||document.documentElement).appendChild(d);
            }
            window.addEventListener('error',function(e){
              paint((e.message||'error')+'\n@ '+(e.filename||'?')+':'+(e.lineno||'?'));
            });
            window.addEventListener('unhandledrejection',function(e){
              paint('unhandled rejection: '+String(e.reason&&e.reason.stack||e.reason));
            });

            // ---- scripted navigation --------------------------------------
            // Each phase is logged into the DOM title so a screenshot can be
            // attributed to a phase with no guessing.
            // The phase banner is a diagnostic. It is kept OFF-SCREEN during
            // the UI captures so it cannot contaminate what is being reviewed
            // (and so screenshot differences reflect the page, not a changing
            // label). It is only made visible on the final diagnostics frame.
            function mark(name){
              var b=document.getElementById('hermes-phase');
              if(!b){
                b=document.createElement('div');
                b.id='hermes-phase';
                b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:2147483645;'+
                  'background:#063;color:#fff;font:11px ui-monospace,monospace;padding:4px 8px;'+
                  'text-align:center;display:none';
                document.body.appendChild(b);
              }
              b.textContent='PHASE: '+name+'  |  requests: '+window.__netlog.length;
            }
            window.__phase = mark;

            // ---- scripted DOM interaction ---------------------------------
            // HONEST NAMING: this is DOM interaction testing, NOT a physical
            // tap. It dispatches synthetic pointer/mouse events on the real
            // tab elements, which exercises the React handlers, the routing
            // and the rendering -- but it does NOT prove the control is
            // hit-testable by a finger (nothing about hit regions, overlapping
            // views, or UIKit gesture recognisers). A true tap test needs
            // XCUITest; see guidelines/ios-testing-limits.md.
            //
            // Results are persisted to localStorage, NOT console.log: a
            // previous run proved console output from a simulator WKWebView
            // never reaches `simctl spawn log show` (0 of 15 [NETLOG] lines
            // arrived). CI reads them back out of the app container, so the
            // assertion can actually fail the build.
            window.__navlog = [];
            function persistNav(){
              try { window.localStorage.setItem('hermes_navlog', JSON.stringify(window.__navlog)); } catch (e) {}
            }
            function findTab(labelText){
              var want = labelText.toUpperCase();
              var nodes = document.querySelectorAll('button, a');
              // Exact match first (tab labels are exact), then a contains
              // match, because CTAs wrap an icon and extra whitespace --
              // "View Free Round Predictions →" never equals the bare label.
              for (var i=0;i<nodes.length;i++){
                if ((nodes[i].textContent||'').trim().toUpperCase() === want) return nodes[i];
              }
              for (var j=0;j<nodes.length;j++){
                var t=(nodes[j].textContent||'').trim().toUpperCase();
                if (t.indexOf(want) !== -1 && t.length < want.length + 24) return nodes[j];
              }
              return null;
            }
            function record(step, ok, why, extra){
              var e = {step:step, ok:ok, why:why};
              if (extra) { for (var k in extra) e[k]=extra[k]; }
              window.__navlog.push(e);
              persistNav();
            }
            // Waits for React to commit before asserting, rather than reading
            // the DOM in the same tick the event was dispatched.
            function afterRender(fn){
              requestAnimationFrame(function(){
                requestAnimationFrame(function(){ window.setTimeout(fn, 600); });
              });
            }
            function clickTab(labelText, expectFragment, done){
              var el = findTab(labelText);
              if (!el){ record(labelText,false,'tab button not found'); if(done)done(false); return; }
              var r = el.getBoundingClientRect();
              if (r.width === 0 || r.height === 0){ record(labelText,false,'tab has zero size'); if(done)done(false); return; }
              var before = (document.body.innerText||'').trim().length;
              ['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(type){
                el.dispatchEvent(new MouseEvent(type, {bubbles:true, cancelable:true, view:window}));
              });
              afterRender(function(){
                var body = (document.body.innerText||'');
                var ok = body.toUpperCase().indexOf(expectFragment.toUpperCase()) !== -1;
                record(labelText, ok,
                  ok ? 'content matched: '+expectFragment : 'expected text not found: '+expectFragment,
                  {textLenBefore: before, textLenAfter: body.trim().length});
                if(done)done(ok);
              });
            }
            window.__clickTab = clickTab;

            // Gate every step on the Matches dashboard actually being open,
            // rather than firing on a fixed timer and hoping. Polls for the
            // real content instead of assuming 14s was enough.
            function whenReady(predicate, timeoutMs, onReady, onTimeout){
              var started = Date.now();
              (function poll(){
                if (predicate()) { onReady(); return; }
                if (Date.now() - started > timeoutMs) { onTimeout(); return; }
                window.setTimeout(poll, 400);
              })();
            }
            function matchesOpen(){
              var t=(document.body.innerText||'').toUpperCase();
              return t.indexOf('MATCHES') !== -1 && (t.indexOf('ROUND') !== -1);
            }

            // Sequential chain: each step starts only after the previous one
            // has rendered, so a slow network cannot desynchronise the run.
            // The timeout is generous because the runner's network has been
            // observed taking 12s+ per Google Sheets CSV (and 27s for a
            // PostHog beacon); a tight timeout tests the wrong screen.
            window.setTimeout(function(){
              // The app starts on the marketing HOME page, not the dashboard.
              // An earlier revision waited for Matches without ever opening
              // it, so every step failed with "tab button not found" while the
              // app sat happily on the landing page.
              //
              // Clicking the real CTA is also the better test: it exercises
              // navigateToApp(), which is exactly the function that used to
              // trap native users behind the email gate.
              mark('opening free predictions');
              var cta = findTab('View Free Round Predictions');
              if (!cta) {
                // Fall back to the router so a label change does not abort the
                // whole run, but record that the CTA was missing.
                record('open-dashboard', false, 'View Free Round Predictions CTA not found');
                window.location.hash = 'matches';
              } else {
                ['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(t){
                  cta.dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,view:window}));
                });
                record('open-dashboard', true, 'free predictions CTA clicked');
              }
              mark('waiting for Matches');
              whenReady(matchesOpen, 60000, function(){
                record('matches-ready', true, 'Matches dashboard rendered');
                mark('Matches ready');
                // 1. Archived round with real fixtures and final scores.
                window.setTimeout(function(){
                  mark('selecting archived round');
                  var sel = findTab('Last Round Results');
                  if (!sel){ record('archive', false, 'Last Round Results not found'); }
                  else {
                    ['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(t){
                      sel.dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,view:window}));
                    });
                    afterRender(function(){
                      var txt = (document.body.innerText||'');
                      // Real evidence: a final score like 24-12 and a fixture.
                      var hasScore = /\b\d{1,2}\s*[-–]\s*\d{1,2}\b/.test(txt);
                      var hasResultWord = /RESULTS?|HIT|MISS/i.test(txt);
                      record('archive', hasScore && hasResultWord,
                        hasScore && hasResultWord ? 'archived round shows fixtures and scores'
                                                  : 'no final score pattern in archived round',
                        {hasScore: hasScore, hasResultWord: hasResultWord});
                      mark('archived round');
                      // Chain the tab steps off the archive completing, not a
                      // wall-clock timer: when the network is slow the whole
                      // sequence shifts together instead of firing at an
                      // arbitrary moment against a half-rendered page.
                      window.setTimeout(runTabSequence, 7000);
                    });
                  }
                }, 500);
              }, function(){
                record('matches-ready', false, 'Matches dashboard never rendered');
                mark('Matches NEVER ready');
                // Still exercise the tabs so the failure report distinguishes
                // "no data" from "navigation broken".
                runTabSequence();
              });
            }, 6000);

            function runTabSequence(){
              mark('tapping PLAYS');
              clickTab('Plays', 'Premium', function(){
                mark('on PLAYS');
                window.setTimeout(function(){
                  mark('tapping MULTI');
                  clickTab('Multi', 'Multi', function(){
                    mark('on MULTI');
                    window.setTimeout(function(){
                      mark('tapping MATCHES');
                      clickTab('Matches', 'Matches', function(){ mark('on MATCHES'); });
                    }, 7000);
                  });
                }, 7000);
              });
            }

            // 95s: the overlay goes LAST, after every UI capture. Earlier
            // runs painted it at 42s and 48s and covered the app in EVERY
            // shot, because a slow `log show` delayed the capture step. The
            // screenshots now finish by ~t+85s, so this is comfortably after.
            window.setTimeout(function(){
              var ph=document.getElementById('hermes-phase');
              if(ph) ph.style.display='block';
              var old=document.getElementById('hermes-netlog'); if(old) old.remove();
              var d=document.createElement('pre');
              d.id='hermes-netlog';
              d.style.cssText='position:fixed;inset:0;z-index:2147483646;margin:0;padding:14px;'+
                'background:#001018;color:#8ff;font:10px ui-monospace,monospace;white-space:pre-wrap;overflow:auto';
              var lines = window.__netlog.map(function(e){
                return (e.ok?'OK  ':'FAIL') + ' ' + String(e.status) + ' ' + e.ms + 'ms ' + e.url;
              });
              // The navigation result is written into the DOM as a machine
              // readable block. The report step parses it and FAILS the job if
              // any tab did not actually change the screen, so a dead tap can
              // no longer pass silently.
              var nav = window.__navlog.map(function(n){
                return (n.ok?'NAV-OK   ':'NAV-FAIL ') + n.step + ' :: ' + n.why;
              });
              var navMarker = document.createElement('div');
              navMarker.id = 'hermes-navresult';
              navMarker.setAttribute('data-nav', JSON.stringify(window.__navlog));
              navMarker.style.display = 'none';
              document.body.appendChild(navMarker);
              d.textContent = 'NAVIGATION\n\n' + (nav.join('\n') || '(no navigation recorded)') +
                '\n\nNETWORK LOG ('+window.__netlog.length+' requests, URLs redacted)\n\n' +
                (lines.join('\n') || '(no requests recorded)');
              document.body.appendChild(d);
            }, 95000);
          })();
          </script>
          PROBE
          node -e "
            const fs=require('fs');
            const p='dist/index.html';
            const probe=fs.readFileSync('/tmp/probe.html','utf8');
            let html=fs.readFileSync(p,'utf8');
            html=html.replace('</head>', probe+'</head>');
            fs.writeFileSync(p,html);
            console.log('error reporter + network recorder injected into', p);
          "

      - name: Sync the web assets into the iOS app
        run: npx cap sync ios

      - name: Build for the simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd ios/App

          # No .xcscheme is committed (Capacitor leaves schemes to Xcode, and
          # ios/.gitignore excludes xcuserdata). xcodebuild normally
          # autocreates one, but that is a setting we should not depend on --
          # so inspect what this project actually exposes and pick
          # accordingly. -target App always exists in the pbxproj.
          echo '--- xcodebuild -list ---'
          xcodebuild -list -project App.xcodeproj || true

          if xcodebuild -list -project App.xcodeproj 2>/dev/null | awk '/Schemes:/,0' | grep -qx '        App'; then
            echo 'building via -scheme App'
            SELECTOR=(-scheme App)
          else
            echo 'no shared scheme; building via -target App'
            SELECTOR=(-target App)
          fi

          xcodebuild \
            -project App.xcodeproj \
            "${SELECTOR[@]}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tail -40

      - name: Boot a simulator, install and launch
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # Pick whatever iPhone this image actually has, rather than pinning a
          # device name that a future image update could remove.
          UDID=$(xcrun simctl list devices available -j \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const j=JSON.parse(s);
                let best=null;
                for (const [rt,devs] of Object.entries(j.devices)) {
                  if (!/iOS/.test(rt)) continue;
                  for (const d of devs) {
                    if (!d.isAvailable) continue;
                    if (!/^iPhone/.test(d.name)) continue;
                    const score=(/17 Pro/.test(d.name)?3:/17/.test(d.name)?2:1);
                    if (!best||score>best.score) best={udid:d.udid,name:d.name,rt,score};
                  }
                }
                if(!best){console.error('no iPhone simulator available');process.exit(1);}
                console.error('using '+best.name+' ('+best.rt+')');
                process.stdout.write(best.udid);
              });")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          echo "app bundle: $APP"
          xcrun simctl install "$UDID" "$APP"

          # Plain `launch` returns immediately with the PID. Do NOT use
          # --console-pty here: it streams the app's output for as long as the
          # app lives, and the Actions runner keeps the step alive while a
          # child holds the step's process group -- so the step hangs until the
          # job timeout instead of moving on to the screenshot. The app keeps
          # running in the simulator either way; its log is collected
          # separately below.
          xcrun simctl launch "$UDID" au.com.rightedge.app

          # Do NOT collect the app log here. `log show` took 27 seconds in a
          # previous run, which pushed the first screenshot to t+40s instead of
          # t+8s and meant the t+48s diagnostics overlay had already painted
          # over the UI captures. The log is collected after the screenshots.
          sleep 8
          echo "app launched; screenshots begin immediately in the next step"

      - name: Screenshot home, navigate, and capture diagnostics
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # AppleScript taps DO NOT WORK on a GitHub runner: System Events has
          # no accessibility permission there, the click silently does nothing,
          # and the previous run proved it -- three screenshots came back
          # byte-identical while the step still reported success. Navigation is
          # therefore driven by the probe inside the page, which dispatches a
          # real pointer+click sequence on the actual tab elements and verifies
          # the resulting content. This step only times the captures to match.
          #
          # Timeline from app launch (probe timers). The probe chains each step
          # off the previous one RENDERING, so these are the earliest times;
          # a slow network shifts them later together.
          #   t+6s   waits for Matches (up to 60s for slow sheet loads)
          #   then   archived round -> Plays -> Multi -> Matches, ~7s apart
          #   t+95s  overlay painted LAST so no UI capture is obscured
          # This step starts ~8s after launch.
          shot () {
            xcrun simctl io "$UDID" screenshot "artifacts/$1.png" >/dev/null 2>&1
            echo "  captured $1 ($(wc -c < "artifacts/$1.png" | tr -d ' ') bytes) at t+$(( $(date +%s) - START ))s"
          }
          START=$(date +%s)

          shot 01-matches              # Matches, as first painted
          sleep 18
          shot 02-archived-round       # archived round with real data
          sleep 14
          shot 03-plays-premium        # Plays premium notice
          sleep 14
          shot 04-multi                # Multi public content
          sleep 14
          shot 05-matches-return       # back on Matches
          sleep 22
          shot 06-diagnostics          # navigation + network overlay

          xcrun simctl spawn "$UDID" log show --last 4m --style compact \
            --predicate 'process == "App"' > artifacts/app.log 2>&1 || true
          echo "app log lines: $(wc -l < artifacts/app.log | tr -d ' ')"

          # Pull the navigation results out of the app's own WebKit storage.
          # console.log from a simulator WKWebView does NOT reach
          # `simctl spawn log show` -- an earlier run recorded 15 requests and
          # zero log lines arrived -- so localStorage is the only channel that
          # actually carries a verdict back to CI.
          #
          # WebKit flushes localStorage to sqlite lazily, so the app MUST be
          # terminated first or the SELECT returns nothing from a live app
          # (an earlier run found the db and read back an empty result).
          CONTAINER=$(xcrun simctl get_app_container "$UDID" au.com.rightedge.app data 2>/dev/null || true)
          echo "app container: ${CONTAINER:-<not found>}"
          xcrun simctl terminate "$UDID" au.com.rightedge.app 2>/dev/null || true
          sleep 4
          if [ -n "$CONTAINER" ]; then
            DB=$(find "$CONTAINER" -name 'localstorage.sqlite3' 2>/dev/null | head -1)
            echo "localstorage db: ${DB:-<not found>}"
            if [ -n "$DB" ]; then
              # WebKit stores the value as UTF-16LE. A plain SELECT stops at
              # the first NUL byte, so "[" came back as the entire result --
              # 2 bytes -- and looked like an empty array. Read it as hex and
              # decode it losslessly instead.
              sqlite3 "$DB" "SELECT hex(value) FROM ItemTable WHERE key='hermes_navlog';" 2>/dev/null \
                > /tmp/navlog.hex || true
              python3 scripts/decode_navlog.py /tmp/navlog.hex > artifacts/navlog.json || echo '[]' > artifacts/navlog.json
              # Diagnose an empty read rather than silently reporting [].
              if [ "$(tr -d '[:space:]' < artifacts/navlog.json)" = "[]" ]; then
                echo "navlog decoded empty; keys present in localStorage:"
                sqlite3 "$DB" "SELECT key FROM ItemTable;" 2>/dev/null | tr -d '\000' | head -20 | sed 's/^/    /'
              fi
            fi
          fi
          if [ ! -s artifacts/navlog.json ]; then
            echo '[]' > artifacts/navlog.json
            echo "WARNING: no navlog recovered from the app container"
          fi
          echo "navlog bytes: $(wc -c < artifacts/navlog.json | tr -d ' ')"
          ls -la artifacts | tail -8

      - name: Redact the logs before anything is uploaded
        if: always()
        run: |
          # The native log can carry emails, JWTs, Stripe ids and full query
          # strings. Redaction happens BEFORE upload-artifact, and the raw
          # files are overwritten in place so there is no unredacted copy left
          # for the upload step to find.
          python3 - <<'PY'
          import re, pathlib
          patterns = [
              (re.compile(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'), '<email>'),
              (re.compile(r'\beyJ[A-Za-z0-9_.-]{20,}'), '<jwt>'),
              (re.compile(r'\b(cs_|sk_|pk_|rk_|sub_|cus_|pi_|seti_)[A-Za-z0-9_]{6,}'), r'\1<redacted>'),
              (re.compile(r'\bsbp_[A-Za-z0-9]{8,}'), '<sb-token>'),
              (re.compile(r'(?i)(authorization|apikey|api_key|token|secret|password)=([^&\s"\']+)'), r'\1=<redacted>'),
              (re.compile(r'(?i)(bearer)\s+[A-Za-z0-9._-]{8,}'), r'\1 <redacted>'),
              # Published-sheet ids and other long opaque path segments.
              (re.compile(r'/[A-Za-z0-9_-]{30,}'), '/<id>'),
          ]
          total = 0
          for p in list(pathlib.Path('artifacts').glob('*.log')) + list(pathlib.Path('artifacts').glob('*.json')):
              text = p.read_text(errors='replace')
              for rx, repl in patterns:
                  text, n = rx.subn(repl, text)
                  total += n
              p.write_text(text)
              print(f'  redacted {p.name}')
          print(f'  {total} replacements')
          PY

      - name: Report what actually rendered and what the network did
        if: always()
        run: |
          # Screenshot hashes alone are NOT proof: the diagnostic phase banner
          # changes text on every step, so two shots can differ while the page
          # underneath is identical. The real verdict comes from the navlog,
          # which records what content was present after React rendered.
          node -e "
            const fs=require('fs'), crypto=require('crypto');
            const shots=['01-matches','02-archived-round','03-plays-premium','04-multi','05-matches-return','06-diagnostics'];
            let missing=0, blank=0;
            for (const s of shots) {
              const p='artifacts/'+s+'.png';
              if (!fs.existsSync(p)) { console.log('MISSING   '+s); missing++; continue; }
              const buf=fs.readFileSync(p);
              const h=crypto.createHash('sha256').update(buf).digest('hex').slice(0,12);
              if (buf.length < 60000) blank++;
              console.log((buf.length<60000?'BLANK?  ':'painted ')+s.padEnd(22)+buf.length+' bytes  '+h);
            }
            if (missing) { console.log('FAIL: '+missing+' screenshot(s) missing'); process.exit(1); }
            if (blank)   { console.log('FAIL: '+blank+' screenshot(s) look blank'); process.exit(1); }
            console.log('');

            // The navigation verdict, recovered from the app's localStorage.
            let nav=[];
            try { nav=JSON.parse(fs.readFileSync('artifacts/navlog.json','utf8')); } catch(e){}
            if (!Array.isArray(nav) || nav.length === 0) {
              console.log('FAIL: no navigation results were recovered from the app.');
              console.log('      The probe could not report, so navigation is UNVERIFIED.');
              process.exit(1);
            }
            console.log('NAVIGATION (from the app, after render):');
            let failed=0;
            for (const n of nav) {
              console.log('  '+(n.ok?'PASS ':'FAIL ')+String(n.step).padEnd(16)+n.why);
              if (!n.ok) failed++;
            }
            console.log('');
            // Every step we rely on must be present AND passing.
            const required=['matches-ready','archive','Plays','Multi','Matches'];
            const byStep=Object.fromEntries(nav.map(n=>[String(n.step),n]));
            for (const r of required) {
              if (!byStep[r]) { console.log('FAIL: no result recorded for \"'+r+'\"'); failed++; }
            }
            if (failed) { console.log('FAIL: '+failed+' navigation assertion(s) failed'); process.exit(1); }
            console.log('PASS: every navigation step reported success');
          "
          echo
          echo '--- HTTP failures and JS errors (redacted) ---'
          grep -iE 'NETWORK_FAIL|JS ERROR|unhandled rejection|didFail|WebContent.*crash' artifacts/app.log 2>/dev/null | head -20 || echo '  none found'
          echo
          echo '--- leak check on artifacts (must print nothing) ---'
          if grep -rlEi '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(com|au|net|org)|eyJ[A-Za-z0-9_-]{20,}|cs_[A-Za-z0-9]{10,}' artifacts/ 2>/dev/null; then
            echo '  LEAK DETECTED in the files above'
            exit 1
          else
            echo '  clean'
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: artifacts/
          retention-days: 14
